spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1401/realms/elearning/protocol/openid-connect/certs

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.keycloak.account-url=http://localhost:8081/realms/e-learning/account

spring.application.name=e-learning
server.port=1444

#Database or Datasource config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=elearninguser
spring.datasource.password=mypassword
spring.datasource.url=jdbc:postgresql://localhost:1400/postgres


#JPA configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.threads.virtual.enabled=true

app.storage.local-path=./storage
app.storage.public-base-url=http://localhost:8080
app.storage.signing-key=change-me-to-something-long-and-random

