spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:1401/realms/elearning
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1401/realms/elearning/protocol/openid-connect/certs

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.keycloak.account-url=http://localhost:8081/realms/e-learning/account

spring.application.name=e-learning
server.port=1444

#Database or Datasource config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=elearning_user
spring.datasource.password=mypassword
spring.datasource.url=jdbc:postgresql://localhost:1300/postgres


#JPA configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Loads related rows in batches instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.threads.virtual.enabled=true
# Compresses JSON responses over 1 KB
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain

app.storage.local-path=./storage
app.storage.public-base-url=http://localhost:8080
app.storage.signing-key=change-me-to-something-long-and-random

#Media Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
media.location=${user.home}/elearning-media-upload/
media.client-path=/media
media.base-uri=http://localhost:1444

keycloak.server-url=http://localhost:1401
keycloak.realm=elearning
keycloak.client-id=private-app
keycloak.client-secret=uuPFGfV5qNXzNGE2JJRZzWe2ZPB56v7p

# AI tutor + quiz AI helper (Groq, OpenAI-compatible API).
# The key comes from the GROQ_API_KEY environment variable or the git-ignored secrets.properties — never commit it.
spring.config.import=optional:file:./secrets.properties
groq.api-key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-120b
groq.reasoning-effort=low
groq.base-url=https://api.groq.com/openai/v1
ai.tutor.questions-per-lesson=3

# Emails (Bunny AI access, notifications). SMTP settings go in secrets.properties; without them only in-app notifications are sent.
app.frontend-url=http://localhost:5173
app.mail.from=Autumn <no-reply@autumn.local>
